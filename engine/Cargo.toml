[workspace]
members = ["op-core", "op-ops", "op-gpu", "op-color", "op-formats", "op-tools", "op-engine", "op-ffi", "op-cli", "op-testkit", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
