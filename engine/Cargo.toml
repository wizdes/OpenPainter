[workspace]
members = ["op-core", "op-ops", "op-gpu", "op-color", "op-formats", "op-tools", "op-engine", "op-ffi", "op-cli", "op-testkit", "op-present-spike", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Debug builds keep overflow checks and debug assertions, but optimize so the
# random-case pixel tests finish inside the fast tier's 2-minute budget.

# Proc macros and build scripts run at build time; stripping their symbols
# breaks proc-macro dylibs on macOS ("can't find crate for zerocopy_derive").
[profile.release.build-override]
strip = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
