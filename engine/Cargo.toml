[workspace]
members = ["op-core", "op-ops", "op-gpu", "op-color", "op-formats", "op-tools", "op-engine", "op-ffi", "op-cli", "op-testkit", "op-present-spike", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Debug builds keep overflow checks and debug assertions, but optimize so the
# random-case pixel tests finish inside the fast tier's 2-minute budget.

# Proc macros and build scripts run at build time; stripping their symbols
# breaks proc-macro dylibs on macOS ("can't find crate for zerocopy_derive").
[profile.release.build-override]
strip = false

# M58: the Mac app's staticlib only (mac/scripts/build-engine.sh passes
# `--profile app-release`; output in target/app-release/). M58 measured fat
# against thin on the app: OpenPainterKit 8.3 MB instead of 9.5 MB (bundle
# 10.7 MB instead of 11.9 MB) at the same launch time; an engine-only rebuild
# takes about 48 s instead of 38 s. Other release builds (op-cli, Linux) keep
# the release profile above.
[profile.app-release]
inherits = "release"
lto = "fat"

[profile.app-release.build-override]
strip = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
