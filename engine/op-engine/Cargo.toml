[package]
name = "op-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
test-commands = []

[dependencies]
op-core = { path = "../op-core" }
op-ops = { path = "../op-ops" }
op-tools = { path = "../op-tools" }
op-formats = { path = "../op-formats" }
op-color = { path = "../op-color" }
op-gpu = { path = "../op-gpu" }
lcms2 = { version = "6.2.0", features = ["static"] }
arc-swap = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# M57 recovery records: the snapshot checksum.
crc32fast = "1.5"

[dev-dependencies]
tempfile = "3"
