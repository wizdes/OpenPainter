[package]
name = "op-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wgpu = { version = "27", features = ["counters"] }
pollster = "0.4"
bytemuck = "1"
op-core = { path = "../op-core" }
op-ops = { path = "../op-ops" }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# CAMetalLayer access for the canvas presenter (layer.rs).
objc = "0.2.7"

[dev-dependencies]
op-testkit = { path = "../op-testkit" }
proptest = "1"
serde_json = "1"
