[package]
name = "op-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
op-engine = { path = "../op-engine", features = ["test-commands"] }
# Live strokes (src/stroke.rs) build op-tools stroke samples.
op-tools = { path = "../op-tools" }
serde_json = "1"
# Canvas views (src/view.rs): op-gpu draws, op-color builds the display table.
op-gpu = { path = "../op-gpu" }
op-color = { path = "../op-color" }
wgpu = { version = "27", features = ["counters"] }
pollster = "0.4"
parking_lot = "0.12"

[dev-dependencies]
# M19 document tests write files.
tempfile = "3"

[build-dependencies]
cbindgen = "0.29"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Makes CAMetalLayers for the view tests (tests/views.rs).
objc = "0.2.7"
