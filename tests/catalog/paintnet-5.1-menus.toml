# paint.net 5.1 menus, item by item, in menu order, and where each one lives in
# OpenPainter's Mac menu bar (M55).
#
# SOURCE: paint.net's public documentation (https://www.getpaint.net/doc/latest/,
# fetched 2026-10-25): the File, Edit, View, Image, Layers, Adjustments and
# Effects menu pages, each Effects submenu page, the Menu Bar and Help Menu pages,
# the menu screenshots on those pages, and the Keyboard & Mouse Commands page.
# It is NOT the 5.1.12 capture that M02 plans (the Windows PC was not reachable).
# M02 can later confirm or replace it. The docs pages are dated 2023 to 2025.
#
# Fields of each [[item]]:
#   pdn      paint.net path, titles as the docs show them ("" for a Mac-only item)
#   win      paint.net's Windows shortcut ("" for none)
#   mac      the item's path in OpenPainter's menu bar ("" when it is not there)
#   key      OpenPainter's shortcut, in MenuSkeleton.describe notation ("" for none)
#   command  our command: an engine command or effect id ("layer.flip_vertical"),
#            or the AppKit action selector ("saveAllDocuments:"); "" for a
#            submenu or an item that is off
#   icon     true when paint.net shows an icon; the Mac item then has an SF Symbol
#   status   v1        built; the item is in the menu and works
#            mac       a Mac-only item (Apple HIG or an OpenPainter addition)
#            not in v1 left out, with the reason from docs/PLAN.md "Not in this version"
#            pending   paint.net has it but no merged milestone builds it yet; it is
#                      in the menu and off when `mac` is set, else absent
#   reason   why an item is not in v1, pending or Mac-only
#   note     anything else (why a shortcut differs, when the item is off)
#   source   the page the item comes from
#
# Shortcut rule: paint.net's Ctrl becomes Cmd and Alt becomes Option. Where that
# clashes with a standard Mac key, the Mac key wins (the note says which).
# Items keep paint.net's order inside each menu; Mac-only items sit where the Mac
# menu has them. tools/catalog/compare-menus.py and MenuCatalogTests check the
# live menu bar against this file.

# Shortcuts two visible items may share. paint.net 5.1's own menus share none
# (Image and Layers both have Flip and Rotate 180 items, with no keys), so the
# list is empty. The hidden Option-Cmd-digit panel twins are not visible items.
shared_shortcuts = []

