# XcodeGen spec for the Mac app. Never hand-edit the generated .xcodeproj.
# Build order (also in `make -C mac`): the Rust staticlib first
# (engine/target/release/libop_ffi.a, built by the "Build engine" phase of
# OpenPainterKit), then EngineBridge, OpenPainterKit and the app.
name: OpenPainter
options:
  bundleIdPrefix: dev.yili
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  EngineBridge:
    path: EngineBridge
  # M53: Apple Vision behind an Objective-C interface (see its Package.swift).
  VisionMask:
    path: VisionMask
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Local ad-hoc signing only.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  OpenPainterKit:
    type: framework
    platform: macOS
    sources:
      - path: OpenPainterKit/Sources
    dependencies:
      - package: EngineBridge
        product: EngineBridge
      - package: VisionMask
        product: VisionMask
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainterKit
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../engine/target/release
        OTHER_LDFLAGS: [-lop_ffi, -liconv, -lobjc]
        SKIP_INSTALL: YES
    preBuildScripts:
      - name: Build engine (cargo build -p op-ffi --release)
        script: exec "$SRCROOT/scripts/build-engine.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../engine/target/release/libop_ffi.a
  OpenPainter:
    type: application
    platform: macOS
    sources:
      - path: OpenPainter
    dependencies:
      - target: OpenPainterKit
    info:
      path: OpenPainter/Info.plist
      properties:
        CFBundleName: OpenPainter
        CFBundleDisplayName: OpenPainter
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "OpenPainter. Zoom steps from Paint.NET 3.36 (MIT)."
        # M19: every format OpenPainter writes is an Editor type (Save, Save
        # As, Save a Copy). WebP and AVIF are written only where
        # CGImageDestinationCopyTypeIdentifiers lists them;
        # ImageDocument.writableTypes decides at run time. Camera RAW and HEIF
        # open only (Viewer).
        CFBundleDocumentTypes:
          - CFBundleTypeName: OpenPainter image
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.yili.openpainter.opaint]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: PNG image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: JPEG image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: BMP image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.microsoft.bmp]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: TIFF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.tiff]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: GIF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.compuserve.gif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: WebP image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.webmproject.webp]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: HEIC image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heic]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: HEIF image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: AVIF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.avif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: Camera RAW image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.camera-raw-image]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
        # The native layered format (an OpenRaster ZIP, engine/op-formats/src/opaint.rs).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.yili.openpainter.opaint
            UTTypeDescription: OpenPainter image
            UTTypeConformsTo: [public.data, public.composite-content, public.image]
            UTTypeTagSpecification:
              public.filename-extension: [opaint]
              public.mime-type: [image/openraster]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainter
        PRODUCT_NAME: OpenPainter
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
  OpenPainterKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OpenPainterKitTests
    dependencies:
      - target: OpenPainterKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainterKitTests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@loader_path/../Frameworks", "@executable_path/../Frameworks"]
schemes:
  OpenPainter:
    build:
      targets:
        OpenPainter: all
        OpenPainterKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OpenPainterKitTests
