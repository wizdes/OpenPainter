# XcodeGen spec for the Mac app. Never hand-edit the generated .xcodeproj.
# Build order (also in `make -C mac`): the Rust staticlib first
# (engine/target/app-release/libop_ffi.a, built by the "Build engine" phase of
# OpenPainterKit), then EngineBridge, OpenPainterKit and the app.
name: OpenPainter
options:
  bundleIdPrefix: dev.yili
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  EngineBridge:
    path: EngineBridge
  # M53: Apple Vision behind an Objective-C interface (see its Package.swift).
  VisionMask:
    path: VisionMask
  # M58: the update feed (https://sparkle-project.org/documentation/, "If you
  # use Swift Package Manager"). Pinned; 2.10.0 was released 2026-09-13.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Local ad-hoc signing only.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    # M60: the version numbers. Local builds say 0.1.0 (1);
    # scripts/release.sh VERSION passes MARKETING_VERSION=VERSION and
    # CURRENT_PROJECT_VERSION=<commits on HEAD> to xcodebuild, so every
    # release raises CFBundleVersion without editing this file.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  # M58: Release is built for size and launch time. Whole-module Swift
  # optimization, dead-code stripping, symbols stripped at build time (not only
  # on install), debug info kept in a separate dSYM, and no debug dylib (Xcode
  # can split an app into a stub plus OpenPainter.debug.dylib).
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_DEBUG_DYLIB: NO
      ENABLE_TESTABILITY: NO
targets:
  OpenPainterKit:
    type: framework
    platform: macOS
    sources:
      - path: OpenPainterKit/Sources
    dependencies:
      - package: EngineBridge
        product: EngineBridge
      - package: VisionMask
        product: VisionMask
      # Linked here (Updates.swift); the app bundle carries the framework.
      - package: Sparkle
        product: Sparkle
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainterKit
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../engine/target/app-release
        OTHER_LDFLAGS: [-lop_ffi, -liconv, -lobjc]
        SKIP_INSTALL: YES
      configs:
        Release:
          # A framework keeps its exported symbols; only local ones go.
          STRIP_STYLE: non-global
    preBuildScripts:
      - name: Build engine (mac/scripts/build-engine.sh)
        script: exec "$SRCROOT/scripts/build-engine.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../engine/target/app-release/libop_ffi.a
  OpenPainter:
    type: application
    platform: macOS
    sources:
      - path: OpenPainter
    dependencies:
      - target: OpenPainterKit
      # Xcode copies Sparkle.framework into Contents/Frameworks for a package
      # product by itself (`embed: true` makes XcodeGen add a second, broken
      # copy step for "Sparkle-product").
      - package: Sparkle
        product: Sparkle
    info:
      path: OpenPainter/Info.plist
      properties:
        CFBundleName: OpenPainter
        CFBundleDisplayName: OpenPainter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "OpenPainter. Zoom steps from Paint.NET 3.36 (MIT)."
        # M58: Sparkle 2 updates (OpenPainterKit Shell/Updates.swift).
        # M60 publishes the feed here (scripts/release.sh writes it).
        SUFeedURL: https://yili.dev/projects/openpainter/appcast.xml
        # M60: the EdDSA public key that checks every update (not secret).
        # Its private half is OPENPAINTER_SPARKLE_PRIVATE_KEY in ~/keys, made
        # 2026-10-25 with the user's OK. Every update must keep this key.
        # With an empty key the updater never starts and Help > Check for
        # Updates says "Updates are not set up yet" (UpdateSettings.isSetUp).
        SUPublicEDKey: "Q1P9GEU6X00XfYERTrMaaVhfra04UVYC2IuWAK0TJoc="
        # Scheduled checks on, with no "check automatically?" question
        # (https://sparkle-project.org/documentation/customization/,
        # SUEnableAutomaticChecks). The default interval is one day.
        SUEnableAutomaticChecks: true
        # The appcast and every archive must be EdDSA-signed (Sparkle docs,
        # "Signing feeds"); M60 signs both with the release key.
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        # Sparkle 2.10 accepts a badly signed feed again once its first
        # failure is older than this many seconds (20 days when unset;
        # SUAppcastDriver.m). 0 means a bad feed is always rejected.
        SUSignedFeedFailureExpirationInterval: 0
        # M19: every format OpenPainter writes is an Editor type (Save, Save
        # As, Save a Copy). WebP and AVIF are written only where
        # CGImageDestinationCopyTypeIdentifiers lists them;
        # ImageDocument.writableTypes decides at run time. Camera RAW and HEIF
        # open only (Viewer).
        CFBundleDocumentTypes:
          - CFBundleTypeName: OpenPainter image
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.yili.openpainter.opaint]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: PNG image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: JPEG image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: BMP image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.microsoft.bmp]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: TIFF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.tiff]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: GIF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.compuserve.gif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: WebP image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.webmproject.webp]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: HEIC image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heic]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: HEIF image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: AVIF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.avif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: Camera RAW image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.camera-raw-image]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
        # The native layered format (an OpenRaster ZIP, engine/op-formats/src/opaint.rs).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.yili.openpainter.opaint
            UTTypeDescription: OpenPainter image
            UTTypeConformsTo: [public.data, public.composite-content, public.image]
            UTTypeTagSpecification:
              public.filename-extension: [opaint]
              public.mime-type: [image/openraster]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainter
        PRODUCT_NAME: OpenPainter
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
  OpenPainterKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OpenPainterKitTests
    dependencies:
      - target: OpenPainterKit
      # UpdateFeedTests drive Sparkle's own updater against a local feed.
      - package: Sparkle
        product: Sparkle
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainterKitTests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@loader_path/../Frameworks", "@executable_path/../Frameworks"]
schemes:
  OpenPainter:
    build:
      targets:
        OpenPainter: all
        OpenPainterKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OpenPainterKitTests
