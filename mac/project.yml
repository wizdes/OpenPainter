# XcodeGen spec for the Mac app. Never hand-edit the generated .xcodeproj.
# Build order (also in `make -C mac`): the Rust staticlib first
# (engine/target/release/libop_ffi.a, built by the "Build engine" phase of
# OpenPainterKit), then EngineBridge, OpenPainterKit and the app.
name: OpenPainter
options:
  bundleIdPrefix: dev.yili
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  EngineBridge:
    path: EngineBridge
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Local ad-hoc signing only.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  OpenPainterKit:
    type: framework
    platform: macOS
    sources:
      - path: OpenPainterKit/Sources
    dependencies:
      - package: EngineBridge
        product: EngineBridge
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainterKit
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../engine/target/release
        OTHER_LDFLAGS: [-lop_ffi, -liconv, -lobjc]
        SKIP_INSTALL: YES
    preBuildScripts:
      - name: Build engine (cargo build -p op-ffi --release)
        script: exec "$SRCROOT/scripts/build-engine.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../engine/target/release/libop_ffi.a
  OpenPainter:
    type: application
    platform: macOS
    sources:
      - path: OpenPainter
    dependencies:
      - target: OpenPainterKit
    info:
      path: OpenPainter/Info.plist
      properties:
        CFBundleName: OpenPainter
        CFBundleDisplayName: OpenPainter
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "OpenPainter. Zoom steps from Paint.NET 3.36 (MIT)."
        CFBundleDocumentTypes:
          - CFBundleTypeName: PNG image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          # M17: ImageIO import. HEIC and AVIF are Editor types because Save As
          # writes them (AVIF only where CGImageDestinationCopyTypeIdentifiers
          # lists it; PainterDocument.writableTypes decides at run time).
          - CFBundleTypeName: HEIF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heic, public.heif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: AVIF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.avif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
          - CFBundleTypeName: Camera RAW image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.camera-raw-image]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).PainterDocument
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainter
        PRODUCT_NAME: OpenPainter
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
  OpenPainterKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OpenPainterKitTests
    dependencies:
      - target: OpenPainterKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.OpenPainterKitTests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@loader_path/../Frameworks", "@executable_path/../Frameworks"]
schemes:
  OpenPainter:
    build:
      targets:
        OpenPainter: all
        OpenPainterKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OpenPainterKitTests
